name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Privacy guard (first substantive check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              sh scripts/check-email-privacy.sh --all
            else
              BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
              sh scripts/check-email-privacy.sh "$BASE_SHA..$HEAD_SHA"
            fi
          else
            sh scripts/check-email-privacy.sh "$BASE_SHA..$HEAD_SHA"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm run test:privacy
      - run: npm run test:geometry
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-exploration-evidence
          path: artifacts/map-exploration/
